name: تحديث الفرص

on:
  schedule:
    - cron: "0 3 * * *"   # كل يوم الساعة 6 الصبح بتوقيت السعودية
  workflow_dispatch:       # زر تشغيل يدوي من تبويب Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: جلب الإعلانات الجديدة
        run: python scripts/update_jobs.py

      - name: حفظ التغييرات
        run: |
          git config user.name "awal-khatwa-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/listings.json
          if git diff --staged --quiet; then
            echo "ما فيه إعلانات جديدة اليوم."
          else
            git commit -m "تحديث الفرص تلقائيًا $(date +%F)"
            git push
          fi

name: تحديث الفرص

on:
  schedule:
    - cron: "0 3 * * *"   # كل يوم الساعة 6 الصبح بتوقيت السعودية
  workflow_dispatch:       # زر تشغيل يدوي من تبويب Actions

permissions:
  contents: write

concurrency:
  group: update-jobs      # تشغيل واحد بس في نفس الوقت
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: جلب الإعلانات الجديدة
        run: python scripts/update_jobs.py

      - name: حفظ التغييرات
        run: |
          git config user.name "awal-khatwa-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/listings.json
          if git diff --staged --quiet; then
            echo "ما فيه إعلانات جديدة اليوم."
            exit 0
          fi
          git commit -m "تحديث الفرص تلقائيًا $(date +%F)"
          # لو انرفع تعديل ثاني أثناء التشغيل، ناخذه أول وبعدين نرفع
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 5
          done
          echo "ما قدرنا نرفع التحديث بعد 3 محاولات"
          exit 1
